# actions — the common verbs of semantic nodes.
#
# Keyboard, pointer, agents and scripts all reach a component through these
# (and the component's own, declared in its contract). `effect` is the default
# classification; a component or an application may declare a stronger one
# for a particular node (a delete button's `activate` is `irreversible`), never
# a weaker one. Argument types: bool, i64, f64, string, point, rect, size.
spec = "0.3"

[[action]]
name   = "activate"
effect = "reversible"
doc    = "Do what the element is for: press a button, follow a link, choose an option."

[[action]]
name   = "focus"
effect = "read"
doc    = "Move keyboard focus to the element."

[[action]]
name   = "blur"
effect = "read"
doc    = "Remove keyboard focus from the element."

[[action]]
name   = "toggle"
effect = "reversible"
doc    = "Flip the checked state of a checkbox, switch or toggle button."

[[action]]
name   = "set_value"
effect = "reversible"
args   = { value = "any" }
doc    = "Replace the value (a slider's number, a text field's text, a select's choice)."

[[action]]
name   = "increment"
effect = "reversible"
doc    = "Step the value up."

[[action]]
name   = "decrement"
effect = "reversible"
doc    = "Step the value down."

[[action]]
name   = "expand"
effect = "reversible"
doc    = "Show the controlled content."

[[action]]
name   = "collapse"
effect = "reversible"
doc    = "Hide the controlled content."

[[action]]
name   = "select"
effect = "reversible"
doc    = "Select the element within its container."

[[action]]
name   = "deselect"
effect = "reversible"
doc    = "Remove the element from its container's selection."

[[action]]
name   = "dismiss"
effect = "reversible"
doc    = "Close a dialog, menu, popup or tooltip without choosing."

[[action]]
name   = "open_menu"
effect = "read"
doc    = "Open the element's context menu."

[[action]]
name   = "scroll_into_view"
effect = "read"
doc    = "Scroll the containers so the element is visible."

[[action]]
name   = "scroll_to"
effect = "read"
args   = { x = "f64 | end | page | -page", y = "f64 | end | page | -page" }
doc    = "Scroll a scroll view to a content offset: a distance, or `end`, `page`, `-page`."

[[action]]
name   = "scroll_by"
effect = "read"
args   = { dx = "f64 | page | -page", dy = "f64 | page | -page" }
doc    = "Scroll a scroll view by a distance, or by `page` / `-page`."

[[action]]
name   = "set_selection"
effect = "read"
args   = { anchor = "i64", focus = "i64" }
doc    = "Set the text selection of a text field (grapheme offsets)."

[[action]]
name   = "replace_selection"
effect = "reversible"
args   = { text = "string" }
doc    = "Replace the selected text of a text field (typing, pasting)."

[[action]]
name   = "move_to"
effect = "reversible"
args   = { x = "f64", y = "f64" }
doc    = "Move a positioned item (a canvas item, a paddle) to a point."

[[action]]
name   = "resize"
effect = "reversible"
args   = { width = "f64", height = "f64" }
doc    = "Resize a positioned item."

[[action]]
name   = "seek"
effect = "read"
args   = { time = "f64" }
doc    = "Move a timeline's playhead to a time in seconds."
