# effects — what performing an action does to the world.
#
# The four classes and their text are openas §3.1's, so "operating a CLI" and
# "operating a UI" are classified the same way. Append-only: a reader skips a
# class it does not know (and treats it as `irreversible`, the safe reading).
#
# `tier` orders the classes for the rule that a node may declare a stronger
# effect than an action's default, never a weaker one.
spec = "0.3"

[[effect]]
name   = "read"
tier   = 0
answer = false
doc    = "Observes state and changes nothing."

[[effect]]
name   = "reversible"
tier   = 1
answer = false
doc    = "Changes state in a way the user can undo (typing, moving, toggling)."

[[effect]]
name   = "irreversible"
tier   = 2
answer = true
doc    = "Changes state in a way that cannot be undone (deleting, sending, paying). Needs an answer (S-1)."

[[effect]]
name   = "external"
tier   = 2
answer = true
doc    = "Reaches outside the application (opens a link, starts a program, uses the network). Needs an answer (S-1)."
