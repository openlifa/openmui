# states — the state bits of a semantic node. Each has a fixed bit; append-only.
spec = "0.3"

[[state]]
name = "disabled"
doc  = "Present but not operable; actions other than `read` are refused."
[[state]]
name = "focusable"
doc  = "Can receive keyboard focus."
[[state]]
name = "focused"
doc  = "Has keyboard focus."
[[state]]
name = "hovered"
doc  = "A pointer is over it."
[[state]]
name = "pressed"
doc  = "Being pressed (pointer or key held)."
[[state]]
name = "checked"
doc  = "On: a checkbox, switch, toggle button or checkable menu item."
[[state]]
name = "mixed"
doc  = "Neither checked nor unchecked (a tri-state checkbox)."
[[state]]
name = "selected"
doc  = "Selected within its container (an option, a tab, a list item)."
[[state]]
name = "expanded"
doc  = "Its controlled content is shown (a disclosure, a combo box, a tree item)."
[[state]]
name = "collapsible"
doc  = "Can be expanded or collapsed; `expanded` tells which."
[[state]]
name = "busy"
doc  = "Being updated; its content may change soon."
[[state]]
name = "hidden"
doc  = "Not shown (kept in the tree for virtualised or off-screen content)."
[[state]]
name = "offscreen"
doc  = "Outside the visible area of its scroll container."
[[state]]
name = "invalid"
doc  = "Its value fails validation."
[[state]]
name = "required"
doc  = "Must have a value before the form it belongs to is submitted."
[[state]]
name = "readonly"
doc  = "Its value can be read and selected but not changed."
[[state]]
name = "editable"
doc  = "Its text can be edited."
[[state]]
name = "multiline"
doc  = "A text field that accepts line breaks."
[[state]]
name = "multiselectable"
doc  = "A container in which several items can be selected."
[[state]]
name = "modal"
doc  = "A dialog that blocks the rest of the application."
[[state]]
name = "default"
doc  = "The default button of its dialog or form."
[[state]]
name = "visited"
doc  = "A link that has been followed."
[[state]]
name = "animating"
doc  = "Moving; bounds and values given are those of the target state."
[[state]]
name = "removing"
doc  = "Leaving the tree (exit animation); accepts no actions (S-4)."
