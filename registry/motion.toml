# motion — the normative definitions of animation (spec §10).
#
# Every curve and the spring are defined by formula, so two implementations
# produce the same values; openmui.anim is the reference (A-level: identical
# bits with its deterministic elementary functions, B-level tolerance 1e-9 for
# another implementation using its platform's libm).
spec = "0.3"

[easing]
# t is clamped to [0, 1]; every curve but steps maps 0 to 0 and 1 to 1 exactly.
linear       = "t"
in_quad      = "t^2"
out_quad     = "1 - (1 - t)^2"
in_out_quad  = "t < 0.5 ? 2t^2 : 1 - (-2t + 2)^2 / 2"
in_cubic     = "t^3"
out_cubic    = "1 - (1 - t)^3"
in_out_cubic = "t < 0.5 ? 4t^3 : 1 - (-2t + 2)^3 / 2"
in_quart     = "t^4"
out_quart    = "1 - (1 - t)^4"
in_out_quart = "t < 0.5 ? 8t^4 : 1 - (-2t + 2)^4 / 2"
in_quint     = "t^5"
out_quint    = "1 - (1 - t)^5"
in_out_quint = "t < 0.5 ? 16t^5 : 1 - (-2t + 2)^5 / 2"
in_sine      = "1 - cos(t·π/2)"
out_sine     = "sin(t·π/2)"
in_out_sine  = "-(cos(π·t) - 1) / 2"
in_expo      = "t = 0 ? 0 : 2^(10t - 10)"
out_expo     = "t = 1 ? 1 : 1 - 2^(-10t)"
in_out_expo  = "t < 0.5 ? 2^(20t - 10) / 2 : (2 - 2^(-20t + 10)) / 2"
in_circ      = "1 - √(1 - t^2)"
out_circ     = "√(1 - (t - 1)^2)"
in_out_circ  = "t < 0.5 ? (1 - √(1 - (2t)^2)) / 2 : (√(1 - (-2t + 2)^2) + 1) / 2"
in_back      = "c3·t^3 - c1·t^2, c1 = 1.70158, c3 = c1 + 1"
out_back     = "1 + c3·(t - 1)^3 + c1·(t - 1)^2"
in_out_back  = "c2 = c1·1.525; t < 0.5 ? (2t)^2·((c2 + 1)·2t - c2) / 2 : ((2t - 2)^2·((c2 + 1)·(2t - 2) + c2) + 2) / 2"
in_elastic   = "-2^(10t - 10)·sin((10t - 10.75)·2π/3)"
out_elastic  = "2^(-10t)·sin((10t - 0.75)·2π/3) + 1"
in_out_elastic = "t < 0.5 ? -(2^(20t - 10)·sin((20t - 11.125)·2π/4.5)) / 2 : 2^(-20t + 10)·sin((20t - 11.125)·2π/4.5) / 2 + 1"
in_bounce    = "1 - out_bounce(1 - t)"
out_bounce   = "n1 = 7.5625, d1 = 2.75; piecewise parabolas at 1/d1, 2/d1, 2.5/d1"
in_out_bounce = "t < 0.5 ? (1 - out_bounce(1 - 2t)) / 2 : (1 + out_bounce(2t - 1)) / 2"
cubic_bezier = "CSS cubic-bezier(x1, y1, x2, y2), x1 and x2 in [0, 1]: solve x(s) = t by 8 Newton steps (stop when |error| < 1e-12, abandon when |x'(s)| < 1e-9 or s leaves [0, 1]), else 52 bisection steps; the value is y(s)"
steps        = "CSS steps(n, jump-start | jump-end | jump-none | jump-both)"
fall         = "fall(e, n, c): a body dropped from rest onto the ground, in first falls (the drop takes 1): it falls as s², stays c·v on the ground at each landing of speed v (the first's 1), leaves at e·v and flies 2·e·v, n times, then lands for good; L = 1 + Σ_{k<n} (c·e^k + 2·e^(k+1)); the value at t is the height fallen at t·L, exactly 1 on the ground and from t·L ≥ L on; e in [0, 1), n in 0..64, c in [0, 1] (0.1 when omitted, n 3)"
spring       = "spring(k, c, m): the [spring] from x0 = 0, v0 = 0 to target 1 with stiffness k, damping c, mass m (1 when omitted); T its settle time with delta = 1e-4 and speed = 1e-3; the value at t is x(t·T), and exactly 1 from t·T ≥ T on"

[spring]
# m·x'' + c·x' + k·(x − target) = 0, solved in closed form from (x0, v0).
equation   = "m·x'' + c·x' + k·(x - target) = 0"
frequency  = "ω0 = √(k/m)"
ratio      = "ζ = c / (2√(k·m))"
under      = "ζ < 1 - 1e-9: x = target + e^(-ζω0·t)·(A·cos(ωd·t) + B·sin(ωd·t)), ωd = ω0√(1 - ζ²), A = x0 - target, B = (v0 + ζω0·A)/ωd"
critical   = "|ζ - 1| ≤ 1e-9: x = target + e^(-ω0·t)·(A + (v0 + ω0·A)·t)"
over       = "ζ > 1 + 1e-9: x = target + C1·e^(r1·t) + C2·e^(r2·t), r1,2 = -ω0(ζ ∓ √(ζ² - 1)), C1 = (v0 - r2·A)/(r1 - r2), C2 = A - C1"
rest       = "settled from the first time the envelope bounds |x - target| ≤ delta and |v| ≤ speed (delta = speed = 1e-3 by default); from then on x = target and v = 0 exactly"
interrupt  = "retargeting at time t starts a new segment from x(t) and v(t) of the current one: position and velocity are continuous"
response   = "response r and bounce b: ω0 = 2π/r, ζ = b ≥ 0 ? 1 - b : 1/(1 + b), m = 1"

[decay]
equation = "x = x0 + v0·τ·(1 - e^(-t/τ)), τ = -1 / (1000·ln(rate)), rate = velocity kept per millisecond (default 0.998)"

[reduced_motion]
rule = "when the user asks for reduced motion, every transition shows its target immediately and springs settle at once; opacity cross-fades of at most 150 ms may remain"

# Motion tokens: the names components and themes use. A theme may re-map them.
[[token]]
name     = "motion.instant"
duration = 0
easing   = "linear"

[[token]]
name     = "motion.fast"
duration = 120
easing   = "cubic-bezier(0.2, 0, 0, 1)"

[[token]]
name     = "motion.normal"
duration = 200
easing   = "cubic-bezier(0.2, 0, 0, 1)"

[[token]]
name     = "motion.slow"
duration = 320
easing   = "cubic-bezier(0.3, 0, 0, 1)"

[[token]]
name     = "motion.enter"
duration = 240
easing   = "cubic-bezier(0, 0, 0, 1)"

[[token]]
name     = "motion.exit"
duration = 160
easing   = "cubic-bezier(0.3, 0, 1, 1)"

[[token]]
name      = "motion.spring.snappy"
stiffness = 400
damping   = 32
mass      = 1

[[token]]
name      = "motion.spring.gentle"
stiffness = 120
damping   = 14
mass      = 1

[[token]]
name      = "motion.spring.bouncy"
stiffness = 180
damping   = 12
mass      = 1

# Motion slots (spec §10, M-7), in order: when a node's drawing changes, which slot the
# change is decides the motion. A node's `motion` property and a style pack's
# motion rules fill slots with recipes; components only draw their state.
[[slot]]
name = "update"
doc  = "the node's drawing changed while it stayed (a value, a label, a colour)"

[[slot]]
name = "enter"
doc  = "the node appeared (mounted, shown, revealed)"

[[slot]]
name = "exit"
doc  = "the node is going (unmounted, hidden); it is drawn until its motion ends"

[[slot]]
name = "state"
doc  = "an interaction state changed (hovered, pressed, focused, checked …)"

[[slot]]
name = "reorder"
doc  = "the node kept its drawing but moved among its siblings"

[[slot]]
name = "replace"
doc  = "the node's content was replaced by other content under the same key"

# Built-in recipes (M-8): ids a slot can name. A recipe composes primitives
# over a timing (a motion token's name, "tween(ms)" or "spring(k, c[, m])"), and
# may carry an effect that rises and falls while the change moves. Ids are
# append-only; a style pack may define more under its own prefix.
#   primitives  match_drawing match_glyphs fade lift panel_lift grow
#               check_grow stretch stagger distance readable_text
#               write (strokes that appear are drawn along their length,
#               those that go undrawn), drop (what appears falls in along
#               fall(0.45, 2) and flattens about its bottom on landing),
#               noise (a moving piece wanders on its way, exact at both ends),
#               reshape (a glyph replaced in a matched run morphs its outline
#               into its replacement's, contour by contour), press (a state
#               change under the pointer presses the drawing in about the
#               finger, or springs it out on release, ringing to rest)
[[recipe]]
name = "none"
doc  = "No motion: the new drawing at once."

[[recipe]]
name       = "morph"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "spring(170, 26)"
doc        = "The node's two drawings matched (by node, meaning and glyph) and drawn between."

[[recipe]]
name       = "simple"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "tween(160)"
doc        = "A morph on a short tween."

[[recipe]]
name       = "spring"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "motion.spring.gentle"
doc        = "A morph on the gentle spring."

[[recipe]]
name       = "liquid"
primitives = ["match_drawing", "match_glyphs", "fade", "stretch"]
timing     = "motion.spring.gentle"
effect     = "metaball"
doc        = "A drop: pulled out along its way, the shapes it passes merging with it."

[[recipe]]
name       = "ink"
primitives = ["match_drawing", "match_glyphs", "fade", "stagger", "distance"]
timing     = "tween(420)"
effect     = "wobble"
doc        = "A brush: unhurried, the line wavering as it goes, the far pieces a little later."

[[recipe]]
name       = "default.action"
primitives = ["match_drawing", "readable_text", "fade"]
timing     = "motion.spring.snappy"
doc        = "What a pressed or activated control does."

[[recipe]]
name       = "default.focus"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "tween(100)"
doc        = "Focus and other interaction states."

[[recipe]]
name       = "default.toggle"
primitives = ["match_drawing", "match_glyphs", "fade", "stretch"]
timing     = "motion.spring.snappy"
doc        = "A switch's thumb travelling, drawn out along its way."

[[recipe]]
name       = "default.check"
primitives = ["match_drawing", "match_glyphs", "fade", "check_grow"]
timing     = "motion.spring.snappy"
doc        = "A mark appearing or going."

[[recipe]]
name       = "default.selection"
primitives = ["match_drawing", "match_glyphs", "stretch"]
timing     = "motion.spring.snappy"
doc        = "A selection indicator moving to the new choice."

[[recipe]]
name       = "default.value"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "motion.spring.snappy"
doc        = "A value changing (a slider, a progress)."

[[recipe]]
name       = "default.count"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "tween(220)"
doc        = "A number changing, glyph by glyph."

[[recipe]]
name       = "default.surface"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "tween(180)"
doc        = "A surface's look changing."

[[recipe]]
name       = "default.structure"
primitives = ["match_drawing", "match_glyphs", "fade"]
timing     = "motion.spring.gentle"
doc        = "Rows, items or panes rearranged."

[[recipe]]
name       = "default.reveal"
primitives = ["match_drawing", "match_glyphs", "fade", "grow"]
timing     = "motion.spring.snappy"
doc        = "Appearing or going in place."

[[recipe]]
name       = "default.panel"
primitives = ["match_drawing", "match_glyphs", "fade", "panel_lift", "grow"]
timing     = "motion.spring.gentle"
doc        = "A panel (dialog, menu, popover) rising into place."

[[recipe]]
name       = "default.notice"
primitives = ["match_drawing", "match_glyphs", "fade", "lift", "grow"]
timing     = "motion.spring.snappy"
doc        = "A notice (toast, tooltip, alert) lifting in."

[[recipe]]
name       = "default.steps"
primitives = ["match_drawing", "match_glyphs", "fade", "stretch"]
timing     = "motion.spring.snappy"
doc        = "Progress through steps."

[[recipe]]
name       = "trace.focus"
primitives = ["match_drawing", "fade", "write"]
timing     = "tween(320)"
doc        = "Focus: the ring traced round as it appears, untraced as it goes."

[[recipe]]
name       = "write.check"
primitives = ["match_drawing", "match_glyphs", "write"]
timing     = "tween(260)"
doc        = "A mark drawn along its stroke as it appears."

[[recipe]]
name       = "enter.drop"
primitives = ["match_drawing", "drop"]
timing     = "tween(700)"
doc        = "What appears drops in, lands, flattens a little, bounces and settles."

[[recipe]]
name       = "travel.noise"
primitives = ["match_drawing", "match_glyphs", "fade", "noise"]
timing     = "motion.spring.gentle"
doc        = "A moving piece wanders a little on its way, exact where it leaves and arrives."

[[recipe]]
name       = "text.reshape"
primitives = ["match_drawing", "match_glyphs", "fade", "reshape"]
timing     = "motion.spring.gentle"
doc        = "Replaced text: a letter's outline becomes the new letter's, holes opening and closing, rather than fading through."

[[recipe]]
name       = "press.squash"
primitives = ["match_drawing", "match_glyphs", "fade", "press"]
timing     = "tween(450)"
doc        = "Pressed: the control pressed in about the finger and ringing back like rubber; let go, a little spring outwards."
