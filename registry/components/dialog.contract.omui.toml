[contract.dialog]
children = "any"
role = "dialog"
spec = "0.1"
doc  = "A window over the application; modal by default."

[contract.dialog.props]
title = { type = "string", default = "" }
open  = { type = "bool", default = false, bindable = true }
modal = { type = "bool", default = true }

[contract.dialog.events]
closed = { args = { result = "string" } }

[contract.dialog.actions]
dismiss = { effect = "reversible" }

[contract.dialog.keys]
"Escape" = "dismiss"

[contract.dialog.parts]
scrim   = {}
surface = {}
title   = {}

[contract.dialog.motion]
surface = "motion.spring.gentle"
scrim   = "motion.normal"
