[contract.progress]
role = "progress"
spec = "0.1"
doc  = "The progress of a task; indeterminate when value is negative."

[contract.progress.props]
value = { type = "f64", default = -1, bindable = true, doc = "0..1, or negative for indeterminate." }
label = { type = "string", default = "" }

[contract.progress.parts]
track = {}
fill  = {}

[contract.progress.motion]
fill = "motion.normal"
