[contract.text]
role = "text"
spec = "0.1"
doc  = "A run of styled text; wraps, aligns and truncates."

[contract.text.props]
text      = { type = "string", default = "", bindable = true, doc = "The text; may be an expression." }
style     = { type = "string", default = "body", doc = "A text style token: display, title, heading, body, label, caption, code." }
color     = { type = "color", default = "", doc = "Overrides the style's colour (theme token or #rrggbb)." }
align     = { type = "enum", values = ["start", "center", "end", "justify"], default = "start" }
wrap      = { type = "bool", default = true }
max_lines = { type = "i32", default = 0, doc = "0 is unlimited; beyond it the text ends with an ellipsis." }
selectable = { type = "bool", default = false }
origin    = { type = "enum", values = ["app", "user_content", "remote"], default = "app", doc = "Where the text came from (S-3)." }

[contract.text.parts]
glyphs = {}
