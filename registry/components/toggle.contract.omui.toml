[contract.toggle]
role = "switch"
spec = "0.1"
doc  = "An on/off switch."

[contract.toggle.props]
checked  = { type = "bool", default = false, bindable = true }
label    = { type = "string", default = "" }
disabled = { type = "bool", default = false }

[contract.toggle.events]
changed = { args = { checked = "bool" } }

[contract.toggle.actions]
toggle   = { effect = "reversible" }
activate = { effect = "reversible" }

[contract.toggle.keys]
"Space|Enter" = "toggle"

[contract.toggle.parts]
track = {}
thumb = {}
label = {}

[contract.toggle.motion]
thumb = "motion.spring.snappy"
track = "motion.fast"
