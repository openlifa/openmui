[contract.menu]
children = "menu_item"
role = "menu"
spec = "0.1"
doc  = "A popup list of commands."

[contract.menu.props]
open = { type = "bool", default = false, bindable = true }

[contract.menu.events]
closed = { args = {} }

[contract.menu.actions]
dismiss = { effect = "reversible" }

[contract.menu.keys]
"Escape" = "dismiss"

[contract.menu.parts]
surface = {}

[contract.menu.motion]
surface = "motion.enter"

[contract.menu_item]
role = "menu_item"
spec = "0.1"
doc  = "A command of a menu."

[contract.menu_item.props]
text     = { type = "string", default = "" }
shortcut = { type = "string", default = "" }
disabled = { type = "bool", default = false }
verb     = { type = "string", default = "" }

[contract.menu_item.events]
activated = { args = {} }

[contract.menu_item.actions]
activate = { effect = "reversible" }

[contract.menu_item.keys]
"Enter|Space" = "activate"
