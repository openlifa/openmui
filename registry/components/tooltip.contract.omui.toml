[contract.tooltip]
role = "tooltip"
spec = "0.1"
doc  = "A short description shown while hovering or focusing an element."

[contract.tooltip.props]
text  = { type = "string", default = "" }
delay = { type = "f64", default = 0.5, doc = "Seconds before showing." }

[contract.tooltip.actions]
dismiss = { effect = "reversible" }

[contract.tooltip.parts]
surface = {}

[contract.tooltip.motion]
surface = "motion.fast"
