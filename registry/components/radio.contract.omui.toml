[contract.radio]
role = "radio"
spec = "0.1"
doc  = "One of a set of mutually exclusive options; the group is the radio_group role."

[contract.radio.props]
value    = { type = "string", default = "", doc = "The value the group takes when this option is selected." }
group    = { type = "string", default = "", bindable = true, doc = "The group's current value (bound to a signal)." }
label    = { type = "string", default = "" }
disabled = { type = "bool", default = false }

[contract.radio.events]
selected = { args = { value = "string" } }

[contract.radio.actions]
select   = { effect = "reversible" }
activate = { effect = "reversible" }

[contract.radio.keys]
"Space" = "select"

[contract.radio.parts]
circle = {}
dot    = {}
label  = {}
