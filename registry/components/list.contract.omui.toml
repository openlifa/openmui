[contract.list]
role = "list"
spec = "0.1"
doc  = "A list of items, virtualised: only the visible items exist as nodes, the rest answer queries (S-7)."

[contract.list.props]
model       = { type = "string", default = "", doc = "The model whose rows are the items." }
estimate    = { type = "f64", default = 32, doc = "Estimated item height before measuring." }
selectable  = { type = "enum", values = ["none", "single", "multiple"], default = "none" }
selected    = { type = "list<string>", default = [], bindable = true }

[contract.list.events]
activated = { args = { key = "string" } }
changed   = { args = { selected = "list<string>" } }

[contract.list.actions]
scroll_to = { effect = "read", args = { x = "f64 | end | page | -page", y = "f64 | end | page | -page" } }

[contract.list.keys]
"Down" = "next"
"Up"   = "previous"

[contract.list.parts]
viewport = {}
item     = {}

[contract.list.commands]
next     = { doc = "Move focus to the next item." }
previous = { doc = "Move focus to the previous item." }
