[contract.image]
role = "image"
spec = "0.1"
doc  = "A raster or vector image; `alt` is its accessible name."

[contract.image.props]
source = { type = "string", default = "", doc = "A path, a resource name or a data URI." }
alt    = { type = "string", default = "", doc = "Text alternative; empty marks the image decorative (role none)." }
fit    = { type = "enum", values = ["contain", "cover", "fill", "none", "scale_down"], default = "contain" }

[contract.image.events]
loaded = { args = { width = "i32", height = "i32" } }
failed = { args = { reason = "string" } }
