[contract.text_box]
role = "text_box"
spec = "0.1"
doc  = "A single- or multi-line text field with selection, clipboard and input methods."

[contract.text_box.props]
text        = { type = "string", default = "", bindable = true }
placeholder = { type = "string", default = "" }
label       = { type = "string", default = "", doc = "The accessible name when no visible label is associated." }
multiline   = { type = "bool", default = false }
readonly    = { type = "bool", default = false }
password    = { type = "bool", default = false }
disabled    = { type = "bool", default = false }
max_length  = { type = "i32", default = 0 }
origin      = { type = "enum", values = ["app", "user_content", "remote"], default = "user_content" }

[contract.text_box.events]
changed   = { args = { text = "string" }, coalesce = "frame" }
submitted = { args = { text = "string" } }

[contract.text_box.actions]
focus             = { effect = "read" }
set_value         = { effect = "reversible", args = { value = "string" } }
set_selection     = { effect = "read", args = { anchor = "i64", focus = "i64" } }
replace_selection = { effect = "reversible", args = { text = "string" } }

[contract.text_box.keys]
"Enter" = "submit"

[contract.text_box.parts]
field       = {}
text        = {}
caret       = {}
selection   = {}
placeholder = {}

[contract.text_box.motion]
caret = "motion.normal"

# Commands are key bindings that are not semantic actions: they act inside
# the component and are not offered to agents.
[contract.text_box.commands]
submit = { doc = "Emit `submitted` (single-line fields)." }
