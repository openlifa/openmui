[contract.select]
role = "combo_box"
spec = "0.1"
doc  = "Chooses one value from a popup list of options."

[contract.select.props]
value    = { type = "string", default = "", bindable = true }
options  = { type = "list<string>", default = [], doc = "Option values; labels come from `labels` or the values." }
labels   = { type = "list<string>", default = [] }
label    = { type = "string", default = "" }
disabled = { type = "bool", default = false }

[contract.select.events]
changed = { args = { value = "string" } }

[contract.select.actions]
expand    = { effect = "reversible" }
collapse  = { effect = "reversible" }
set_value = { effect = "reversible", args = { value = "string" } }

[contract.select.keys]
"Space|Enter|Alt+Down" = "expand"
"Escape"               = "collapse"

[contract.select.parts]
button  = {}
popup   = {}
option  = {}
chevron = {}

[contract.select.motion]
popup = "motion.enter"
