# roles — what a semantic node is.
#
# The set aligns with ARIA and AccessKit (`aria`, `accesskit` give the mapping a
# platform accessibility layer uses). `interactive` roles must have a name (S-6)
# and should have an explicit id. Append-only: the generated enum keeps this order.
spec = "0.3"

[[role]]
name        = "none"
aria        = "none"
accesskit   = "GenericContainer"
interactive = false
doc         = "Not exposed: presentation only."

[[role]]
name        = "generic"
aria        = "generic"
accesskit   = "GenericContainer"
interactive = false
doc         = "A container with no meaning of its own."

[[role]]
name        = "application"
aria        = "application"
accesskit   = "Application"
interactive = false
doc         = "The root of an application's interface."

