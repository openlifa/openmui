# abi — the C ABI, openmui.h (spec §8): the one boundary every language binding uses.
#
# Rules (normative):
#   - only handles and values cross it; no C++ type, no exception;
#   - every function returns OmuiResult; results that are text or structured
#     data are delivered to a caller-supplied sink, so no memory changes hands;
#   - structured values (views, queries, actions, envelopes) travel as JSON
#     text whose shapes are the spec's (view.schema.json, the bus interface);
#   - append-only: a struct that can grow starts with `type` and `next`.
#
# The generator writes the C declarations from this file; runtime/abi
# implements them; lang/* bind to them.
spec = "0.3"
prefix = "omui"

[[handle]]
name = "OmuiRuntime"
kind = "pointer"
doc  = "One running openmui instance: its tree, signals, verbs and clock."

[[handle]]
name = "OmuiNode"
kind = "u64"
doc  = "A node; stale after the node leaves the tree (calls return OMUI_ERROR_STALE_HANDLE)."

[[handle]]
name = "OmuiSignal"
kind = "u64"
doc  = "A signal owned by the runtime."

[[handle]]
name = "OmuiSubscription"
kind = "u64"
doc  = "An event subscription."

[[result]]
name = "OMUI_SUCCESS"
value = 0
doc = "Done."
[[result]]
name = "OMUI_NEEDS_ANSWER"
value = 2
doc = "The action needs an answer (S-2); the sink received the options. Never waits."
[[result]]
name = "OMUI_NOT_READY"
value = 3
doc = "A wait timed out before its condition held."
[[result]]
name = "OMUI_ERROR_INVALID_ARGUMENT"
value = -1
doc = "An argument is malformed (bad JSON, unknown property, wrong type)."
[[result]]
name = "OMUI_ERROR_NOT_FOUND"
value = -2
doc = "No node, signal, verb or slot by that name."
[[result]]
name = "OMUI_ERROR_STALE_HANDLE"
value = -3
doc = "The handle's node left the tree."
[[result]]
name = "OMUI_ERROR_REFUSED"
value = -4
doc = "The node is disabled or removing (S-4), or a permission refused the effect."
[[result]]
name = "OMUI_ERROR_EXTENSION_NOT_PRESENT"
value = -5
doc = "A requested extension is not provided."
[[result]]
name = "OMUI_ERROR_INCOMPATIBLE_VERSION"
value = -6
doc = "The runtime implements an older spec than requested."
[[result]]
name = "OMUI_ERROR_INTERNAL"
value = -7
doc = "A failure inside the runtime; the sink received a diagnostic."
[[result]]
name = "OMUI_ERROR_FAILED"
value = -8
doc = "The work ran and did not succeed (a native function said why); the sink received the reason."

[[enum]]
name = "OmuiValueType"
doc  = "The type of an OmuiValue."
values = ["NULL", "BOOL", "INT", "DOUBLE", "STRING", "JSON"]

[[enum]]
name = "OmuiStructureType"
doc  = "The `type` of an extensible struct."
values = ["RUNTIME_CREATE_INFO", "FRAME_INPUT", "FRAME_OUTPUT", "VERB_DESC", "VERB_PERSON"]

[[struct]]
name = "OmuiString"
doc  = "UTF-8 text; `data` need not be NUL-terminated."
fields = [
  { name = "data", type = "const char*" },
  { name = "size", type = "size_t" },
]

[[struct]]
name = "OmuiValue"
doc  = "A value: null, bool, int, double, string, or JSON text for lists and maps."
fields = [
  { name = "type", type = "OmuiValueType" },
  { name = "b", type = "uint32_t", doc = "BOOL: 0 or 1" },
  { name = "i", type = "int64_t", doc = "INT" },
  { name = "d", type = "double", doc = "DOUBLE" },
  { name = "s", type = "OmuiString", doc = "STRING and JSON" },
]

[[struct]]
name = "OmuiProp"
doc  = "A property assignment of a batch."
fields = [
  { name = "name", type = "OmuiString" },
  { name = "value", type = "OmuiValue" },
]

[[struct]]
name = "OmuiExtensionProperties"
fields = [
  { name = "name", type = "char", array = 64 },
  { name = "version", type = "uint32_t" },
]

[[struct]]
name = "OmuiRuntimeCreateInfo"
extensible = true
fields = [
  { name = "spec_version", type = "uint32_t", doc = "OMUI_SPEC_VERSION the caller was built against." },
  { name = "app_id", type = "OmuiString", doc = "Reverse-domain application id." },
  { name = "profile", type = "OmuiString", doc = "A profile of profiles.toml; empty is `full`." },
  { name = "extension_count", type = "uint32_t" },
  { name = "extensions", type = "const OmuiString*" },
  { name = "headless", type = "uint32_t", doc = "Non-zero: no display; frames are driven by omuiFrame." },
]

[[struct]]
name = "OmuiFrameInput"
extensible = true
fields = [
  { name = "time", type = "double", doc = "The frame's time in seconds on the runtime's clock." },
  { name = "width", type = "uint32_t", doc = "Surface size in physical pixels." },
  { name = "height", type = "uint32_t" },
  { name = "scale", type = "double", doc = "Physical pixels per logical pixel." },
  { name = "events_json", type = "OmuiString", doc = "Input events of the frame (host interface)." },
]

[[struct]]
name = "OmuiFrameOutput"
extensible = true
fields = [
  { name = "revision", type = "uint64_t", doc = "The semantic tree's revision after the frame." },
  { name = "animating", type = "uint32_t", doc = "Non-zero: another frame is wanted." },
  { name = "pixels", type = "void*", doc = "Optional: premultiplied BGRA8 destination (CPU rendering)." },
  { name = "stride", type = "uint32_t" },
]

[[struct]]
name = "OmuiVerbDesc"
extensible = true
fields = [
  { name = "name", type = "OmuiString", doc = "Lower-case words separated by dots." },
  { name = "summary", type = "OmuiString" },
  { name = "effect", type = "OmuiEffect" },
  { name = "answer", type = "OmuiString", doc = "The answer that confirms it (irreversible, external)." },
]

[[struct]]
name = "OmuiVerbPerson"
extensible = true
doc  = "Chained to an OmuiVerbDesc (`next`): the verb is the person's own (S-10)."
fields = [
  { name = "person", type = "uint32_t", doc = "Non-zero: only the person at the machine invokes it; a request over the bus is refused, whatever its actor." },
]

[[callback]]
name = "PFN_omuiSink"
returns = "void"
params = [ { name = "user", type = "void*" }, { name = "data", type = "const char*" }, { name = "size", type = "size_t" } ]
doc = "Receives text: JSON, NDJSON envelopes or a diagnostic. Called zero or more times per call."

[[callback]]
name = "PFN_omuiEvent"
returns = "void"
params = [ { name = "user", type = "void*" }, { name = "node", type = "OmuiNode" }, { name = "event", type = "OmuiString" }, { name = "args_json", type = "OmuiString" } ]
doc = "An event of a node, on the runtime's thread."

[[callback]]
name = "PFN_omuiVerb"
returns = "OmuiResult"
params = [ { name = "user", type = "void*" }, { name = "args_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "sink_user", type = "void*" } ]
doc = "A verb's implementation."

[[callback]]
name = "PFN_omuiTask"
returns = "void"
params = [ { name = "user", type = "void*" } ]
doc = "Work posted to the runtime's thread."

[[function]]
name = "omuiCreateRuntime"
params = [ { name = "info", type = "const OmuiRuntimeCreateInfo*" }, { name = "out", type = "OmuiRuntime*" } ]
doc = "Creates a runtime."
[[function]]
name = "omuiDestroyRuntime"
params = [ { name = "rt", type = "OmuiRuntime" } ]
doc = "Destroys a runtime and everything it owns."
[[function]]
name = "omuiEnumerateExtensions"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "count", type = "uint32_t*" }, { name = "props", type = "OmuiExtensionProperties*" } ]
doc = "Two-call idiom: props NULL sets count; otherwise fills up to count."
[[function]]
name = "omuiMount"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "slot", type = "OmuiString" }, { name = "view_json", type = "OmuiString" } ]
doc = "Mounts a view document (view.schema.json) at a slot, replacing what was there (reconciled)."
[[function]]
name = "omuiUnmount"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "slot", type = "OmuiString" } ]
doc = "Removes the view at a slot."
[[function]]
name = "omuiFind"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "selector", type = "OmuiString" }, { name = "out", type = "OmuiNode*" } ]
doc = "The node whose id matches the selector (an id path, or a query JSON); the first in tree order."
[[function]]
name = "omuiGet"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "node", type = "OmuiNode" }, { name = "prop", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "A property's value, as JSON, to the sink."
[[function]]
name = "omuiSet"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "node", type = "OmuiNode" }, { name = "props", type = "const OmuiProp*" }, { name = "count", type = "uint32_t" } ]
doc = "Assigns properties as one batch, applied at the next frame boundary."
[[function]]
name = "omuiOn"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "node", type = "OmuiNode" }, { name = "event", type = "OmuiString" }, { name = "fn", type = "PFN_omuiEvent" }, { name = "user", type = "void*" }, { name = "out", type = "OmuiSubscription*" } ]
doc = "Subscribes to an event of a node; high-frequency events are coalesced per frame."
[[function]]
name = "omuiOff"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "sub", type = "OmuiSubscription" } ]
doc = "Ends a subscription."
[[function]]
name = "omuiSignalCreate"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "initial", type = "const OmuiValue*" }, { name = "out", type = "OmuiSignal*" } ]
doc = "Creates a signal."
[[function]]
name = "omuiSignalSet"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "signal", type = "OmuiSignal" }, { name = "value", type = "const OmuiValue*" } ]
doc = "Writes a signal; dependants update at the next frame boundary."
[[function]]
name = "omuiSignalGet"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "signal", type = "OmuiSignal" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "A signal's value, as JSON."
[[function]]
name = "omuiBind"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "node", type = "OmuiNode" }, { name = "prop", type = "OmuiString" }, { name = "signal", type = "OmuiSignal" } ]
doc = "Binds a property to a signal (two-way when the property is bindable)."
[[function]]
name = "omuiRegisterVerb"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "desc", type = "const OmuiVerbDesc*" }, { name = "fn", type = "PFN_omuiVerb" }, { name = "user", type = "void*" } ]
doc = "Registers an application verb."
[[function]]
name = "omuiInvoke"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "verb", type = "OmuiString" }, { name = "args_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "Invokes a verb; the sink receives its envelope."
[[function]]
name = "omuiFrame"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "in", type = "const OmuiFrameInput*" }, { name = "out", type = "OmuiFrameOutput*" } ]
doc = "Runs one frame of a host-driven runtime (headless, engines)."
[[function]]
name = "omuiSnapshot"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "query_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "The semantic tree, or the part a query selects, as JSON (bus interface `snapshot`)."
[[function]]
name = "omuiAct"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "request_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "Performs an action (bus interface `act`); OMUI_NEEDS_ANSWER when an answer is missing (S-2)."
[[function]]
name = "omuiWait"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "condition_json", type = "OmuiString" }, { name = "timeout_ms", type = "uint32_t" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "Waits for a condition (bus interface `wait`), running frames of a headless runtime meanwhile."
[[function]]
name = "omuiPost"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "fn", type = "PFN_omuiTask" }, { name = "user", type = "void*" } ]
doc = "Runs fn on the runtime's thread at the next frame boundary; callable from any thread."

# ── 0.1, appended (M3: bindings need these) ──

[[callback]]
name = "PFN_omuiChange"
returns = "void"
params = [ { name = "user", type = "void*" }, { name = "signal", type = "OmuiSignal" }, { name = "value_json", type = "OmuiString" } ]
doc = "A signal's new value, on the runtime's thread, after the batch that wrote it."

[[function]]
name = "omuiCheck"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "view_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "Checks a view document against what is registered; the sink receives one JSON diagnostic per line. OMUI_ERROR_INVALID_ARGUMENT when there is an error."
[[function]]
name = "omuiDefineComponent"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "component_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "Defines (or redefines) the component of a document with an interface; the sink receives its diagnostics."
[[function]]
name = "omuiSignalFind"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "slot", type = "OmuiString" }, { name = "name", type = "OmuiString" }, { name = "out", type = "OmuiSignal*" } ]
doc = "The signal a view mounted at a slot declares, by name: what a binding's own signal object refers to."
[[function]]
name = "omuiSignalWatch"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "signal", type = "OmuiSignal" }, { name = "fn", type = "PFN_omuiChange" }, { name = "user", type = "void*" }, { name = "out", type = "OmuiSubscription*" } ]
doc = "Calls fn after each batch that changed the signal; omuiOff ends it."
[[function]]
name = "omuiRun"
params = [ { name = "rt", type = "OmuiRuntime" } ]
doc = "Shows a runtime created without `headless` in a window and runs it until the window closes; OMUI_ERROR_EXTENSION_NOT_PRESENT where no display host is linked."
[[function]]
name = "omuiSignalShare"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "signal", type = "OmuiSignal" }, { name = "name", type = "OmuiString" } ]
doc = "Names a signal for view documents, which declare it with \"provided\": true: one state for the binding's code and every view. A view's own events (`emit`) reach omuiOn on the slot's root node."
[[function]]
name = "omuiModelSplice"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "model", type = "OmuiString" }, { name = "from", type = "uint32_t" }, { name = "remove", type = "uint32_t" }, { name = "rows_json", type = "OmuiString" } ]
doc = "Replaces `remove` rows of a model at `from` with rows_json ([{\"key\": …, fields…}]), as one change: push, insert, patch, remove and clear in one call. Keys are ids (S-8), unique in the model."
[[function]]
name = "omuiModelRows"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "model", type = "OmuiString" }, { name = "from", type = "uint32_t" }, { name = "count", type = "uint32_t" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "A model's rows [from, from + count), as JSON ([{\"key\": …, fields…}])."
[[function]]
name = "omuiCatalog"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "The registered components, as JSON: each one's contract (properties with their type, default and whether they bind two-way; events with their arguments; actions with their effect), and the properties and events every node has. Bindings build typed builders from it; agents read it."
[[function]]
name = "omuiNativeCatalog"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "The native modules the program registered (component-binding §8), as JSON: each module's records, and its functions with their parameters, return type, effect and whether scripts may await them. Bindings make their native modules from it."
[[function]]
name = "omuiNativeCall"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "module_name", type = "OmuiString" }, { name = "function_name", type = "OmuiString" }, { name = "args_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "Calls a native module's function on the calling thread (any thread: it touches no runtime state). The arguments are a JSON list in the contract's order or an object by name, and are checked against the contract; the sink receives an envelope with the result as data, or an error record (invalid-argument, not-found, failed)."
[[function]]
name = "omuiTheme"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "layers_json", type = "OmuiString" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "Composes a theme from the program's theme library and gives it to the runtime: a JSON list, a theme then overlays ([\"dark\", \"compact\", \"reduced_motion\"]). Every component follows on the next frame; the semantic tree is the same. A name no theme file declares is not found; a composition that cannot be made is an invalid argument; either way the sink receives why and the theme stays."
[[function]]
name = "omuiThemes"
params = [ { name = "rt", type = "OmuiRuntime" }, { name = "sink", type = "PFN_omuiSink" }, { name = "user", type = "void*" } ]
doc = "The program's themes and overlays and the runtime's composition, as JSON: {\"themes\": [\"dark\", \"light\"], \"overlays\": [\"compact\"], \"current\": \"dark+compact\", \"dark\": true}."
