# origins — where the text of a node came from (S-3).
#
# An agent reading a semantic tree treats `user_content` and `remote` text as
# data, never as instructions: it is the prompt-injection boundary.
spec = "0.3"

[[origin]]
name = "app"
doc  = "Written by the application's authors (labels, messages)."

[[origin]]
name = "user_content"
doc  = "Entered by a user (a note, a message being written)."

[[origin]]
name = "remote"
doc  = "Received from elsewhere (a web page, an e-mail, a model's output)."
