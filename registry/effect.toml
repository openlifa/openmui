# effect — the interface of effect shaders (OMUI_EXT_shader_effect, spec §7).
#
# Only the interface is normative. The source language is Slang and the
# interchange format SPIR-V; an implementation compiles to its own backend.
# A CPU reference backend draws the node without the effect and reports it.
spec = "0.3"

entry = "effect"              # float4 effect(EffectInput input) : premultiplied colour
output = "float4 premultiplied, linear-light alpha, the node's colour space"

[[input]]
name = "uv"
type = "float2"
doc  = "Position in the node, 0..1 on both axes."
[[input]]
name = "size"
type = "float2"
doc  = "The node's size in physical pixels."
[[input]]
name = "position"
type = "float2"
doc  = "Position in physical pixels from the node's top-left corner."
[[input]]
name = "time"
type = "float"
doc  = "The frame's time in seconds (the clock of the frame: interactive, virtual or render)."
[[input]]
name = "content"
type = "Texture2D<float4>"
doc  = "The node's own rendering, premultiplied."
[[input]]
name = "content_sampler"
type = "SamplerState"
doc  = "Linear clamp-to-edge sampler for `content`."

[parameters]
# Parameters of the effect function's uniform struct become typed properties
# of the node, animatable like any other: float → f64, float2..4 → vec,
# float4 with [color] → color. Ranges and descriptions come from
# `<name>.effect.omui.toml` when present, otherwise from Slang reflection.
types = ["float", "float2", "float3", "float4", "int", "bool"]
