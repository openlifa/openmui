# profiles — what a distribution of openmui provides.
spec = "0.3"

[[profile]]
name    = "full"
scripts = ["ts"]
doc     = "The desktop distribution: every Core component, and the script language."

[[profile]]
name    = "mobile"
scripts = ["ts"]
doc     = "Phones and tablets."

[[profile]]
name    = "embedded-linux"
scripts = ["ts"]
doc     = "Embedded Linux with a display, with the script language."

[[profile]]
name    = "mcu"
scripts = []
doc     = "Microcontrollers: retained mode, no script language required (Wasm when needed)."

[[profile]]
name    = "engine"
scripts = []
doc     = "Inside a game engine, beside the engine's own scripting."

[[profile]]
name    = "headless"
scripts = []
doc     = "Tests, agents and video rendering: no display."
